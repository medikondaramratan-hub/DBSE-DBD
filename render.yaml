services:
  - type: web
    name: exam-prep-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: exam-prep-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: exam-prep-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: exam-prep-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: exam-prep-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: exam-prep-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DDL_AUTO
        value: update

databases:
  - name: exam-prep-db
    databaseName: exam_prep_db
    user: postgres
    plan: free
    region: oregon
